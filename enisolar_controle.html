<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>ENISOLAR Quad – Control</title>
<style>
:root{color-scheme:dark;--bg:#0b0e14;--pn:#121826;--bd:#2a3550;--tx:#dfe6f2;--mu:#8793ab;--ac:#4cc9f0;--ok:#7ee081;--wr:#ff6b6b;--am:#ff9f1c;box-sizing:border-box}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:16px;cursor:pointer}
button:active,button.hold{border-color:var(--ac);background:#1c2e48}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* landscape console: left cluster | centre | right cluster */
#app{height:100%;display:grid;grid-template-columns:1fr minmax(140px,210px) 1fr;gap:12px;align-items:stretch;
 padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.side{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.pad{height:100%;max-width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:7px}
.pad button{padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:clamp(20px,6vh,30px);line-height:1;touch-action:none}
.pad button small{font-size:clamp(9px,2.6vh,12px);color:var(--mu);font-weight:500}
.pad .c{border:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:clamp(9px,2.6vh,12px);text-align:center;pointer-events:none}
.u{grid-area:1/2}.d{grid-area:3/2}.l{grid-area:2/1}.r{grid-area:2/3}.c{grid-area:2/2}

.mid{display:flex;flex-direction:column;gap:9px;min-height:0;justify-content:center}
.top{display:flex;align-items:center;gap:9px}
#dot{width:12px;height:12px;border-radius:50%;background:var(--wr);flex:none}
#dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
#stt{flex:1;min-width:0;font-weight:600;font-size:13px}
#stt small{display:block;color:var(--mu);font-weight:400;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cfgb{width:40px;height:40px;font-size:18px;padding:0;flex:none;border-radius:12px}
.mid .big{height:clamp(52px,17vh,78px);font-size:clamp(15px,4.4vh,19px);font-weight:700}
.mid .big small{display:block;font-weight:400;font-size:11px;color:var(--mu);margin-top:2px}
#bA.on{background:var(--ok);color:#052208;border-color:var(--ok)}#bA.on small{color:#0d4a14}
#bA:not(.on){border-color:var(--wr)}
#bM.on{background:var(--am);color:#2a1700;border-color:var(--am)}#bM.on small{color:#5a3300}
#log{color:var(--mu);font:10px ui-monospace,Menlo,Consolas,monospace;height:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center}

/* settings sheet */
#cfg{display:none;position:fixed;inset:0;z-index:5;background:rgba(5,8,14,.94);overflow:auto;padding:max(14px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px))}
#cfg.open{display:block}
#cfg .in{max-width:640px;margin:0 auto}
#cfg h1{font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
#cfgx{width:40px;height:40px;padding:0;border-radius:12px;font-size:16px}
#cfg .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
#cfg .grid .w{grid-column:1/-1}
#cfg label{display:block;color:var(--mu);font-size:12px}
#cfg input{width:100%;margin-top:3px;padding:10px;font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:10px;user-select:text;-webkit-user-select:text}
#cfg .row{display:flex;gap:10px;margin-top:12px}
#cfg .row button{flex:1;padding:12px}
@media (orientation:portrait){#cfg .grid{grid-template-columns:1fr}}

/* portrait: ask to rotate (unless typing settings) */
#rot{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#rot svg{width:84px;height:84px;stroke:var(--ac);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#rot b{font-size:18px}#rot span{color:var(--mu)}
@media (orientation:portrait){body:not(.cfgopen) #rot{display:flex}}
@media (prefers-reduced-motion:no-preference){#dot{transition:background .2s,box-shadow .2s}@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}#rot svg{animation:rot 2.2s ease-in-out infinite alternate}}
</style></head><body>
<main id="app">
  <div class="side">
    <div class="pad" aria-label="Throttle and yaw">
      <button class="u" data-t="up" aria-label="Climb">▲<small>up</small></button>
      <button class="d" data-t="down" aria-label="Descend">▼<small>down</small></button>
      <button class="l" data-t="yaw_left" aria-label="Yaw left">⟲<small>yaw</small></button>
      <button class="r" data-t="yaw_right" aria-label="Yaw right">⟳<small>yaw</small></button>
      <div class="c">height<br>&amp; turn</div>
    </div>
  </div>

  <div class="mid">
    <div class="top">
      <span id="dot"></span>
      <div id="stt">Disconnected<small id="sub">—</small></div>
      <button id="cfgb" aria-label="Connection settings" aria-expanded="false">⚙</button>
    </div>
    <button class="big" id="bA" type="button">Disarmed<small>tap to arm</small></button>
    <button class="big" id="bM" type="button">Stabilized<small>tap for acro</small></button>
    <div id="log" aria-live="polite"></div>
  </div>

  <div class="side">
    <div class="pad" aria-label="Pitch and roll">
      <button class="u" data-t="forward" aria-label="Pitch forward">▲<small>forward</small></button>
      <button class="d" data-t="back" aria-label="Pitch back">▼<small>back</small></button>
      <button class="l" data-t="left" aria-label="Roll left">◀<small>left</small></button>
      <button class="r" data-t="right" aria-label="Roll right">▶<small>right</small></button>
      <div class="c">move</div>
    </div>
  </div>
</main>

<section id="cfg"><div class="in">
  <h1>Connection <button id="cfgx" type="button" aria-label="Close">✕</button></h1>
  <div class="grid">
    <label class="w">Broker (WebSocket)<input id="url" value="wss://3741a09c57ad476c8fd43f8042614b57.s1.eu.hivemq.cloud:8884/mqtt" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label>Username<input id="usr" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label>Password<input id="pwd" type="password"></label>
    <label class="w">Base topic<input id="base" value="quad" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  </div>
  <div class="row"><button id="bCon" type="button">Connect</button><button id="bDis" type="button">Disconnect</button></div>
</div></section>

<div id="rot"><svg viewBox="0 0 64 64"><rect x="20" y="6" width="24" height="52" rx="5"/><path d="M30 52h4"/></svg><b>Turn your phone sideways</b><span>The controller works in landscape, like a game console.</span></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/*
  Each button = one topic under the base topic (default "quad"). Payload "1" / "0".
  quad/arm      1 = armed, 0 = disarmed
  quad/mode     1 = acro, 0 = stabilized
  hold buttons  (1 while pressed, 0 on release):
  quad/up  quad/down  quad/yaw_left  quad/yaw_right  quad/forward  quad/back  quad/left  quad/right
*/
const $=id=>document.getElementById(id);
let client=null,base='quad';
const st={arm:false,mode:false};
const held=new Map(); // pointerId -> {t,el}

const saved=(()=>{try{return JSON.parse(localStorage.getItem('enisolar-ctl2')||'{}')}catch(e){return{}}})();
for(const k of ['url','base','usr'])if(saved[k])$(k).value=saved[k];

function log(t){$('log').textContent=t}
function setStatus(on,t,sub){$('dot').classList.toggle('on',on);$('stt').firstChild.nodeValue=t;$('sub').textContent=sub||'—'}
function pub(topic,payload){
  if(!client||!client.connected){log('not connected');return false}
  client.publish(base+'/'+topic,String(payload),{qos:0});
  log(base+'/'+topic+'  '+payload);return true;
}
function buzz(ms=12){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

function connect(){
  disconnect();
  base=$('base').value.trim().replace(/^\/+|\/+$/g,'')||'quad';
  try{localStorage.setItem('enisolar-ctl2',JSON.stringify({url:$('url').value,base:$('base').value,usr:$('usr').value}))}catch(e){}
  if(typeof mqtt==='undefined'){setStatus(false,'Library not loaded','check your internet connection');return}
  setStatus(false,'Connecting…',$('url').value);
  const o={clientId:'ctl_'+Math.random().toString(16).slice(2,10),clean:true,reconnectPeriod:3000,connectTimeout:8000,keepalive:30,username:$('usr').value,password:$('pwd').value};
  client=mqtt.connect($('url').value.trim(),o);
  client.on('connect',()=>{setStatus(true,'Connected',base+'/…');setCfg(false)});
  client.on('reconnect',()=>setStatus(false,'Reconnecting…',$('url').value));
  client.on('close',()=>{if(client)setStatus(false,'Disconnected',$('url').value)});
  client.on('error',e=>setStatus(false,'Error',e&&e.message||'connection failed'));
}
function disconnect(){
  if(client){const c=client;client=null;try{c.end(true)}catch(e){}}
  setStatus(false,'Disconnected','—');
}

function setBtn(id,on,label,sub){const b=$(id);b.classList.toggle('on',on);b.innerHTML=label+'<small>'+sub+'</small>'}
$('bA').onclick=()=>{const v=!st.arm;if(pub('arm',v?1:0)){st.arm=v;setBtn('bA',v,v?'Armed':'Disarmed',v?'tap to disarm':'tap to arm');buzz(30)}};
$('bM').onclick=()=>{const v=!st.mode;if(pub('mode',v?1:0)){st.mode=v;setBtn('bM',v,v?'Acro':'Stabilized',v?'tap for stabilized':'tap for acro');buzz()}};

document.querySelectorAll('[data-t]').forEach(el=>{
  const down=e=>{
    e.preventDefault();
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    held.set(e.pointerId,{t:el.dataset.t,el});
    el.classList.add('hold');pub(el.dataset.t,1);buzz(8);
  };
  const up=e=>{
    const h=held.get(e.pointerId);if(!h)return;
    held.delete(e.pointerId);h.el.classList.remove('hold');pub(h.t,0);
  };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
// safety: page hidden while a button is held -> release everything
document.addEventListener('visibilitychange',()=>{if(document.hidden){held.forEach(h=>{h.el.classList.remove('hold');pub(h.t,0)});held.clear()}});

function setCfg(o){$('cfg').classList.toggle('open',o);document.body.classList.toggle('cfgopen',o);$('cfgb').setAttribute('aria-expanded',o)}
$('cfgb').onclick=()=>setCfg(!$('cfg').classList.contains('open'));
$('cfgx').onclick=()=>setCfg(false);
$('bCon').onclick=connect;
$('bDis').onclick=disconnect;
setCfg(true); // password is never stored: enter it and tap Connect
</script>
</body></html>
